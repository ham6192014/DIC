[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "pydic"
version = "0.1.0"
description = "Subset-based 2D and stereo Digital Image Correlation"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
include = ["pydic*"]
